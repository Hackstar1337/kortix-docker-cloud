name: Bug report
description: Reproducible integration bug without credentials or private runtime data
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never attach PATs, application keys, private env files or raw provider logs. Report vulnerabilities privately; see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Integration release and pinned upstream revision
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Sanitized reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Public report safety
      options:
        - label: I removed credentials and private instance/project/session/provider identifiers.
          required: true
